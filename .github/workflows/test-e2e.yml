name: Test e2e
on: 
  push:
    branches:
      - '**'
  workflow_dispatch: {}


permissions:
  id-token: write
  contents: write

jobs:
  build-cdk-image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: 1.24.x

    - name: Build cdk docker image
      run: make build-docker
    
    - name: Save cdk image to archive
      run: docker save --output /tmp/cdk.tar cdk
    
    - name: Upload archive
      uses: actions/upload-artifact@v4
      with:
        name: cdk
        path: /tmp/cdk.tar

  read-test-args:
    name: Read tests args
    runs-on: ubuntu-latest
    outputs:
      test-fork9-cdk-validium-e2e-args: ${{ steps.read-args.outputs.test-fork9-cdk-validium-e2e-args }}
      test-fork11-rollup-e2e-args: ${{ steps.read-args.outputs.test-fork11-rollup-e2e-args }}
      test-fork12-cdk-validium-e2e-args: ${{ steps.read-args.outputs.test-fork12-cdk-validium-e2e-args }}
      test-fork12-rollup-e2e-args: ${{ steps.read-args.outputs.test-fork12-rollup-e2e-args }}
      test-fork12-pessimistic-e2e-args: ${{ steps.read-args.outputs.test-fork12-pessimistic-e2e-args }}
      test-fork12-rollup-e2e-args-zkevm-bridge: ${{ steps.read-args.outputs.test-fork12-rollup-e2e-args-zkevm-bridge }}
      # multi l2 networks
      kurtosis-cdk-args-1: ${{ steps.read-args.outputs.kurtosis-cdk-args-1 }}
      kurtosis-cdk-args-2: ${{ steps.read-args.outputs.kurtosis-cdk-args-2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read kurtosis-cdk-args from file
        id: read-args
        run: |
          CONTENT=$(cat ./.github/test_fork9_cdk_validium_e2e_args.json | jq -c .)
          echo "test-fork9-cdk-validium-e2e-args=${CONTENT}" >> $GITHUB_OUTPUT
          CONTENT=$(cat ./.github/test_fork11_rollup_e2e_args.json | jq -c .)
          echo "test-fork11-rollup-e2e-args=${CONTENT}" >> $GITHUB_OUTPUT
          CONTENT=$(cat ./.github/test_fork12_cdk_validium_e2e_args.json | jq -c .)
          echo "test-fork12-cdk-validium-e2e-args=${CONTENT}" >> $GITHUB_OUTPUT
          CONTENT=$(cat ./.github/test_fork12_rollup_e2e_args.json | jq -c .)
          echo "test-fork12-rollup-e2e-args=${CONTENT}" >> $GITHUB_OUTPUT
          CONTENT=$(cat ./.github/test_fork12_pessimistic_e2e_args.json | jq -c .)
          echo "test-fork12-pessimistic-e2e-args=${CONTENT}" >> $GITHUB_OUTPUT
          CONTENT=$(cat ./.github/test_fork12_rollup_e2e_args_zkevm_bridge.json | jq -c .)
          echo "test-fork12-rollup-e2e-args-zkevm-bridge=${CONTENT}" >> $GITHUB_OUTPUT

          # multi l2 networks (l2 network 1)
          CONTENT=$(cat ./.github/test_fork12_rollup_multi_e2e_args_1.json | jq -c .)
          echo "kurtosis-cdk-args-1=${CONTENT}" >> $GITHUB_OUTPUT
          # multi l2 networks (l2 network 2)
          CONTENT=$(cat ./.github/test_fork12_rollup_multi_e2e_args_2.json | jq -c .)
          echo "kurtosis-cdk-args-2=${CONTENT}" >> $GITHUB_OUTPUT

  test-fork9-cdk-validium-e2e:
    name: E2E test
    needs:
      - build-cdk-image
      - read-test-args
    uses: agglayer/e2e/.github/workflows/cdk-e2e.yml@91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
    secrets: inherit
    with:
      kurtosis-cdk-ref: 891e53fa18ce9c908eeac8e0ea9c90eb17614fef
      agglayer-e2e-ref: 91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
      test-name: test-fork9-cdk-validium-e2e
      kurtosis-cdk-args: ${{ needs.read-test-args.outputs.test-fork9-cdk-validium-e2e-args }}

  check-fork9-cdk-validium-e2e-result:
    name: Check E2E results
    needs:
      - test-fork9-cdk-validium-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-fork9-cdk-validium-e2e.result) }}

  test-fork11-rollup-e2e:
    name: E2E test
    needs:
      - build-cdk-image
      - read-test-args
    uses: agglayer/e2e/.github/workflows/cdk-e2e.yml@91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
    secrets: inherit
    with:
      kurtosis-cdk-ref: 891e53fa18ce9c908eeac8e0ea9c90eb17614fef
      agglayer-e2e-ref: 91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
      test-name: test-fork11-rollup-e2e
      kurtosis-cdk-args: ${{ needs.read-test-args.outputs.test-fork11-rollup-e2e-args }}

  check-fork11-rollup-e2e-result:
    name: Check E2E results
    needs:
      - test-fork11-rollup-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-fork11-rollup-e2e.result) }}

  test-fork12-cdk-validium-e2e:
    name: E2E test
    needs:
      - build-cdk-image
      - read-test-args
    uses: agglayer/e2e/.github/workflows/cdk-e2e.yml@91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
    secrets: inherit
    with:
      kurtosis-cdk-ref: 891e53fa18ce9c908eeac8e0ea9c90eb17614fef
      agglayer-e2e-ref: 91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
      test-name: test-fork12-cdk-validium-e2e
      kurtosis-cdk-args: ${{ needs.read-test-args.outputs.test-fork12-cdk-validium-e2e-args }}

  check-fork12-cdk-validium-e2e-result:
    name: Check E2E results
    needs:
      - test-fork12-cdk-validium-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-fork12-cdk-validium-e2e.result) }}

  test-fork12-rollup-e2e:
    name: E2E test
    needs:
      - build-cdk-image
      - read-test-args
    uses: agglayer/e2e/.github/workflows/cdk-e2e.yml@91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
    secrets: inherit
    with:
      kurtosis-cdk-ref: 891e53fa18ce9c908eeac8e0ea9c90eb17614fef
      agglayer-e2e-ref: 91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
      test-name: test-fork12-rollup-e2e
      kurtosis-cdk-args: ${{ needs.read-test-args.outputs.test-fork12-rollup-e2e-args }}

  check-fork12-rollup-e2e-result:
    name: Check E2E results
    needs:
      - test-fork12-rollup-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-fork12-rollup-e2e.result) }}

  test-fork12-pessimistic-e2e:
    name: E2E test
    needs:
      - build-cdk-image
      - read-test-args
    uses: agglayer/e2e/.github/workflows/cdk-e2e.yml@91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
    secrets: inherit
    with:
      kurtosis-cdk-ref: 891e53fa18ce9c908eeac8e0ea9c90eb17614fef
      agglayer-e2e-ref: 91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
      test-name: test-fork12-pessimistic-e2e
      kurtosis-cdk-args: ${{ needs.read-test-args.outputs.test-fork12-pessimistic-e2e-args }}

  check-fork12-pessimistic-e2e-result:
    name: Check E2E results
    needs:
      - test-fork12-pessimistic-e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-fork12-pessimistic-e2e.result) }}

  test-fork12-rollup-e2e-zkevm-bridge:
    name: E2E test
    needs:
      - build-cdk-image
      - read-test-args
    uses: agglayer/e2e/.github/workflows/cdk-e2e.yml@91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
    secrets: inherit
    with:
      kurtosis-cdk-ref: 891e53fa18ce9c908eeac8e0ea9c90eb17614fef
      agglayer-e2e-ref: 91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
      test-name: test-fork12-rollup-e2e-zkevm-bridge
      kurtosis-cdk-args: ${{ needs.read-test-args.outputs.test-fork12-rollup-e2e-args-zkevm-bridge }}

  check-fork12-rollup-e2e-zkevm-bridge-result:
    name: Check E2E results
    needs:
      - test-fork12-rollup-e2e-zkevm-bridge
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-fork12-rollup-e2e-zkevm-bridge.result) }}

  test-multi-l2-networks:
    name: Multi chains E2E test
    needs:
      - build-cdk-image
      - read-test-args
    uses: agglayer/e2e/.github/workflows/cdk-e2e-multi-chains.yml@91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
    secrets: inherit
    with:
      kurtosis-cdk-ref: 891e53fa18ce9c908eeac8e0ea9c90eb17614fef
      agglayer-e2e-ref: 91331909b6064ee9c84fb4a7abda4cc5b9c40bfc
      kurtosis-cdk-args-1: ${{ needs.read-test-args.outputs.kurtosis-cdk-args-1 }}
      kurtosis-cdk-args-2: ${{ needs.read-test-args.outputs.kurtosis-cdk-args-2 }}

  check-multi-l2-networks-tests-result:
    name: Check results for multi l2 networks
    needs:
      - test-multi-l2-networks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(fromJSON('["failure", "cancelled"]'), needs.test-multi-l2-networks.result) }}
